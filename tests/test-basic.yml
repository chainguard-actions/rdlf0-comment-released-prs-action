name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: fake-token-for-testing
        continue-on-error: true
      - name: Assert action ran (outputs exist or action completed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_IDS: ${{ steps.action.outputs.pr-ids }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-ids: $PR_IDS"
          # The action may fail due to fake token, but it should at least start
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
