name: Test basic usage - non-release event graceful exit
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with default inputs
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        # The action only processes 'release' events with action='published'.
        # Under workflow_dispatch, it logs an error and returns early without
        # failing the step (it calls core.error, not core.setFailed).

      - name: Assert action completed without failing the step
        run: |
          echo "Action step completed successfully (graceful early exit for non-release event)"
          echo "PASS"

      - name: Assert pr-ids output is empty for non-release event
        env:
          PR_IDS: ${{ steps.action.outputs.pr-ids }}
        run: |
          echo "pr-ids output: '$PR_IDS'"
          # For a non-release event, the action returns early before setting output
          # so pr-ids should be empty
          if [ -n "$PR_IDS" ]; then
            echo "FAIL: expected pr-ids to be empty for non-release event, got: $PR_IDS"
            exit 1
          fi
          echo "PASS: pr-ids is empty as expected for non-release event"
