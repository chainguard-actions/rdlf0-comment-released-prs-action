name: Test with label adding enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          add-label: "true"
          label-pattern: "released-in-{{name}}"

      - name: Assert action completed without failure
        run: |
          echo "Action step with add-label=true and custom label-pattern completed successfully"
          echo "PASS"

      - name: Assert pr-ids output is empty (not a release event)
        env:
          PR_IDS: ${{ steps.action.outputs.pr-ids }}
        run: |
          echo "pr-ids output: '$PR_IDS'"
          # Under workflow_dispatch, the action returns early because it's not a
          # release published event. The pr-ids output should be empty.
          if [ -n "$PR_IDS" ]; then
            echo "FAIL: expected empty pr-ids output for non-release event, got: $PR_IDS"
            exit 1
          fi
          echo "PASS: pr-ids is empty as expected for non-release event"
