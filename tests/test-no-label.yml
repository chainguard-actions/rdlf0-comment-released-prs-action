name: Test with add-label false (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          add-label: "false"
        continue-on-error: true
      - name: Assert action completed without adding labels
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_IDS: ${{ steps.action.outputs.pr-ids }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-ids: $PR_IDS"
          # The action may succeed or fail gracefully when not in a release context.
          # We accept both 'success' and 'failure' as long as it doesn't crash the runner.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
