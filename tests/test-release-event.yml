name: Test release event context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: release
      GITHUB_REF: refs/tags/v1.0.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN || 'dummy-token' }}
          comment-body: "Released in v1.0.0"
        continue-on-error: true
      - name: Assert action ran in release event context
        env:
          PR_IDS: ${{ steps.action.outputs.pr-ids }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-ids: $PR_IDS"
          # The action may fail due to no real GitHub API in act,
          # but it should not be skipped — it must have been attempted.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran in release event context, outcome=$OUTCOME"
