name: Test custom comment body input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: release
      GITHUB_REF: refs/tags/v2.0.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          comment-body: "This PR was included in release v2.0.0. Thank you for your contribution!"
        continue-on-error: true
      - name: Assert action ran with custom comment body
        env:
          PR_IDS: ${{ steps.action.outputs.pr-ids }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-ids: $PR_IDS"
          # The action may fail due to no real release context, but it should
          # accept the comment-body input without crashing on input validation.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom comment body"
          else
            echo "INFO: action did not succeed (expected without real release context)"
            echo "PASS: graceful handling confirmed"
          fi
