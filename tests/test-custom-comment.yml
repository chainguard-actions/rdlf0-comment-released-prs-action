name: Test custom comment body
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          comment-body: "This PR was included in release v1.0.0 🎉"
        continue-on-error: true
      - name: Assert action ran with custom comment body
        env:
          PR_IDS: ${{ steps.action.outputs.pr-ids }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-ids: $PR_IDS"
          # The action may succeed or fail gracefully when not triggered by a release event.
          # Either way, we verify it ran (outcome is success or failure, not skipped/cancelled).
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom comment body, outcome=$OUTCOME, pr-ids=$PR_IDS"
